<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Katie&#x27;s Bakes</title>
<meta name="description" content="Katie&#x27;s Bakes - Handmade cakes &amp; treats, baked fresh in Dublin" />
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@500;600;700&family=Lato:wght@400;700&family=Inter:wght@400;500;600;700;800&family=Montserrat:wght@600;700;800&family=Open+Sans:wght@400;600&family=Roboto+Slab:wght@600;700&family=Roboto:wght@400;500;700&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0&display=swap" rel="stylesheet">
<style>
  /* ---- THEME TOKENS (one of: salon shop market yard studio) ---- */
  :root{ /* default = studio */
    --bg:#0D1117; --text:#C9D1D9; --muted:#8b97a5; --card:#161B22;
    --line:#30363D; --accent:#58A6FF; --oncard:#0D1117;
    --hfont:"Space Grotesk",sans-serif; --bfont:"Inter",sans-serif;
  }
  body[data-theme="salon"]{ --bg:#F9F5F0; --text:#4A4A4A; --muted:#847373; --card:#F3E7E0;
    --line:rgba(0,0,0,.09); --accent:#C98B8B; --oncard:#fff;
    --hfont:"Playfair Display",serif; --bfont:"Lato",sans-serif; }
  body[data-theme="shop"]{ --bg:#FFFFFF; --text:#1F2022; --muted:#5b6168; --card:#F9F9F9;
    --line:rgba(0,0,0,.08); --accent:#2B2D42; --oncard:#fff;
    --hfont:"Inter",sans-serif; --bfont:"Inter",sans-serif; }
  body[data-theme="market"]{ --bg:#FFF9E6; --text:#1D3557; --muted:#5d6b80; --card:#FBEFC9;
    --line:rgba(0,0,0,.09); --accent:#E63946; --oncard:#fff;
    --hfont:"Montserrat",sans-serif; --bfont:"Open Sans",sans-serif; }
  body[data-theme="yard"]{ --bg:#1A1A1A; --text:#F5F5F5; --muted:#a9a39c; --card:#242424;
    --line:rgba(255,255,255,.13); --accent:#D4A373; --oncard:#1A1A1A;
    --hfont:"Roboto Slab",serif; --bfont:"Roboto",sans-serif; }
  body[data-theme="studio"]{ --bg:#0D1117; --text:#C9D1D9; --muted:#8b97a5; --card:#161B22;
    --line:#30363D; --accent:#58A6FF; --oncard:#0D1117;
    --hfont:"Space Grotesk",sans-serif; --bfont:"Inter",sans-serif; }

  *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
  html{-webkit-font-smoothing:antialiased;-moz-osx-font-smoothing:grayscale;text-rendering:optimizeLegibility}
  body{font-family:var(--bfont);color:var(--text);background:var(--bg);
    min-height:100vh;display:flex;justify-content:center;padding:40px 20px 56px;
    line-height:1.6;}
  .material-symbols-outlined{font-size:21px;line-height:1}
  .wrap{width:100%;max-width:440px;display:flex;flex-direction:column;align-items:center}
  h1,h2{font-family:var(--hfont)}

  /* ---- header ---- */
  .avatar-ring{width:118px;height:118px;border-radius:50%;padding:3px;background:var(--accent);
    margin-bottom:14px;flex:none}
  .avatar{width:100%;height:100%;border-radius:50%;object-fit:cover;display:block;
    border:2px solid var(--bg);background:var(--card)}
  h1{font-size:30px;font-weight:600;letter-spacing:-.01em;text-align:center;line-height:1.15}
  .tag{color:var(--muted);font-size:16px;margin-top:8px;text-align:center;max-width:300px}
  .loc{display:inline-flex;align-items:center;gap:6px;color:var(--muted);font-size:13px;
    margin-top:14px;background:var(--card);border:1px solid var(--line);
    border-radius:999px;padding:6px 14px;font-weight:600;letter-spacing:.03em}
  .loc .material-symbols-outlined{font-size:16px}

  /* ---- action buttons ---- */
  .acts{margin-top:26px;width:100%;display:flex;flex-direction:column;gap:12px}
  .acts a{display:flex;align-items:center;justify-content:center;gap:10px;height:52px;
    text-decoration:none;border-radius:14px;font-size:14px;font-weight:700;
    letter-spacing:.03em;color:var(--text);background:var(--card);
    border:1px solid var(--line);
    transition:transform .15s ease, filter .2s ease, background-color .2s ease;}
  .acts a:hover{filter:brightness(.98)}
  .acts a:active{transform:scale(.98)}
  .acts a:focus-visible{outline:none;box-shadow:0 0 0 2px var(--bg),0 0 0 4px var(--accent)}
  .acts a.primary{background:var(--accent);color:var(--oncard);border-color:transparent;
    box-shadow:0 6px 18px rgba(0,0,0,.10)}
  .acts a.primary:hover{filter:brightness(1.06)}

  /* ---- section heading ---- */
  .sechead{margin:40px 0 0;font-size:22px;font-weight:600;text-align:center;
    width:100%;border-bottom:1px solid var(--line);padding-bottom:14px}

  /* ---- gallery ---- */
  .gallery{margin-top:20px;width:100%;display:grid;grid-template-columns:1fr 1fr;gap:12px}
  .item{background:var(--card);border:1px solid var(--line);border-radius:14px;
    overflow:hidden;cursor:pointer;display:flex;flex-direction:column;
    transition:transform .25s ease, box-shadow .25s ease}
  .item:hover{transform:translateY(-4px);box-shadow:0 10px 24px rgba(0,0,0,.12)}
  .item:active{transform:scale(.99)}
  .item .imgbox{width:100%;aspect-ratio:1/1;overflow:hidden;background:var(--bg)}
  .item img{width:100%;height:100%;object-fit:cover;display:block;
    transition:transform .5s ease}
  .item:hover img{transform:scale(1.05)}
  .item .cap{padding:12px}
  .item .cap .nm{font-size:14px;font-weight:700;line-height:1.25}
  .item .cap .pr{font-size:13px;color:var(--muted);font-weight:700;margin-top:3px}

  /* ---- lightbox (full uncropped image) ---- */
  .lb{position:fixed;inset:0;display:none;flex-direction:column;align-items:center;
    justify-content:center;background:rgba(0,0,0,.9);z-index:60;padding:22px}
  .lb.show{display:flex}
  .lb img{max-width:100%;max-height:78vh;object-fit:contain;border-radius:12px}
  .lb .cap{color:#fff;margin-top:16px;text-align:center}
  .lb .cap .nm{font-size:18px;font-weight:700}
  .lb .cap .pr{color:var(--accent);font-weight:700;margin-top:4px}
  .lb .x{position:absolute;top:18px;right:20px;color:#fff;cursor:pointer;
    background:rgba(255,255,255,.16);width:44px;height:44px;border-radius:50%;
    display:flex;align-items:center;justify-content:center;font-size:24px}

  /* ---- footer ---- */
  .foot{margin-top:40px;width:100%;text-align:center;border-top:1px solid var(--line);
    padding-top:18px;color:var(--muted);font-size:12.5px}
  .foot #footcontact{font-weight:600;letter-spacing:.04em;text-transform:uppercase}
  .foot a{color:var(--accent);text-decoration:none}
  .madeby{margin-top:10px;font-size:11px;opacity:.7}
</style>
</head>
<body data-theme="salon">
  <div class="wrap">
    <div class="avatar-ring"><img class="avatar" src="photos/avatar.jpg" alt="Katie&#x27;s Bakes" /></div>
    <h1>Katie&#x27;s Bakes</h1>
    <p class="tag">Handmade cakes &amp; treats, baked fresh in Dublin</p>
    <div class="loc"><span class="material-symbols-outlined">location_on</span>Dublin, Ireland</div>

    <div class="acts" id="acts"></div>

    <h2 class="sechead" id="galleryhead" style="display:none">My Bakes</h2>
    <div class="gallery" id="gallery"></div>

    <div class="foot">
      <span id="footcontact"></span>
      <div class="madeby">Card by Taiwo &middot; <a href="https://iamtamilore.github.io/links/" target="_blank">get yours</a></div>
    </div>
  </div>

  <div class="lb" id="lb" onclick="closeLb(event)">
    <span class="x material-symbols-outlined" onclick="closeLb(event,true)">close</span>
    <img id="lbimg" src="" alt="" />
    <div class="cap"><div class="nm" id="lbnm"></div><div class="pr" id="lbpr"></div></div>
  </div>

<script>
/* The generator injects DATA below this line. */
const DATA = {"actions": [{"type": "whatsapp", "label": "Order on WhatsApp", "url": "https://wa.me/353800000000"}, {"type": "instagram", "label": "Instagram", "url": "https://instagram.com/"}, {"type": "contact", "label": "Save my number", "url": "contact.vcf"}], "products": [{"img": "photos/01.jpg", "name": "Red Velvet", "price": "\u20ac28"}, {"img": "photos/02.jpg", "name": "Chocolate Fudge", "price": "\u20ac30"}, {"img": "photos/03.jpg", "name": "Vanilla Cupcakes", "price": "\u20ac18 / 6"}, {"img": "photos/04.jpg", "name": "Baked Cheesecake", "price": "\u20ac26"}], "footer": "Order yours: hello@katiesbakes.ie"};

/* action buttons - Material Symbols icon per type (no emoji = less "cheap" tell) */
const ICON = { phone:"call", whatsapp:"chat", instagram:"photo_camera", email:"mail",
  website:"language", book:"calendar_month", tiktok:"music_note", facebook:"thumb_up",
  map:"location_on", contact:"person_add" };
const acts = document.getElementById("acts");
acts.innerHTML = (DATA.actions||[]).map((a,i)=>`
  <a class="${i===0?'primary':''}" href="${a.url}" target="_blank" rel="noopener">
    <span class="material-symbols-outlined">${ICON[a.type]||"link"}</span>
    <span>${a.label}</span>
  </a>`).join("");

/* gallery */
const g = document.getElementById("gallery");
const prods = DATA.products||[];
if(prods.length){
  document.getElementById("galleryhead").style.display="block";
  g.innerHTML = prods.map((p,i)=>`
    <div class="item" onclick="openLb(${i})">
      <div class="imgbox"><img src="${p.img}" alt="${p.name||''}" loading="lazy"></div>
      <div class="cap">
        <div class="nm">${p.name||''}</div>
        ${p.price?`<div class="pr">${p.price}</div>`:''}
      </div>
    </div>`).join("");
}

/* lightbox */
function openLb(i){
  const p = prods[i];
  document.getElementById("lbimg").src = p.img;
  document.getElementById("lbnm").textContent = p.name||"";
  document.getElementById("lbpr").textContent = p.price||"";
  document.getElementById("lb").classList.add("show");
}
function closeLb(e,force){
  if(force || e.target.id==="lb"){ document.getElementById("lb").classList.remove("show"); }
}
document.addEventListener("keydown",e=>{ if(e.key==="Escape") document.getElementById("lb").classList.remove("show"); });

/* footer contact */
if(DATA.footer) document.getElementById("footcontact").innerHTML = DATA.footer;
</script>
</body>
</html>
