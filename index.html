<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Taiwo Alabi</title>
<meta name="description" content="Taiwo Alabi — AI builder. LinkedIn and live AI projects." />
<style>
  :root{
    --bg1:#0b1220; --bg2:#16243f; --card:rgba(255,255,255,.06);
    --line:rgba(255,255,255,.14); --text:#eef3fb; --muted:#9fb0c8; --accent:#3b82f6;
  }
  *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
  body{
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    color:var(--text); min-height:100vh;
    background:radial-gradient(1200px 600px at 50% -10%, #1e3a6b 0%, var(--bg1) 55%) fixed;
    display:flex; justify-content:center; padding:42px 18px 60px;
  }
  .wrap{width:100%; max-width:460px; text-align:center}

  .avatar{
    width:120px;height:120px;border-radius:50%;object-fit:cover;
    border:3px solid rgba(255,255,255,.85);
    box-shadow:0 10px 30px rgba(0,0,0,.45); margin:0 auto 16px; display:block;
  }
  h1{font-size:26px;font-weight:800;letter-spacing:-.3px}
  .tag{color:var(--muted);font-size:15px;margin-top:6px;line-height:1.5}
  .loc{display:inline-flex;align-items:center;gap:6px;color:var(--muted);
    font-size:13px;margin-top:12px;background:var(--card);border:1px solid var(--line);
    border-radius:20px;padding:5px 13px}

  .links{margin-top:26px;display:flex;flex-direction:column;gap:13px}
  a.btn{
    display:flex;align-items:center;gap:14px;text-decoration:none;color:var(--text);
    background:var(--card);border:1px solid var(--line);border-radius:16px;
    padding:15px 18px;font-size:16px;font-weight:600;
    transition:transform .12s ease, background .2s ease, border-color .2s ease;
    backdrop-filter:blur(8px);
  }
  a.btn:hover{transform:translateY(-2px);background:rgba(255,255,255,.11);border-color:rgba(255,255,255,.3)}
  a.btn:active{transform:scale(.98)}
  a.btn .ico{flex:none;width:38px;height:38px;border-radius:11px;display:flex;
    align-items:center;justify-content:center;font-size:19px;background:rgba(255,255,255,.10)}
  a.btn .meta{display:flex;flex-direction:column;align-items:flex-start;line-height:1.25}
  a.btn .meta small{color:var(--muted);font-weight:500;font-size:12.5px}
  a.btn .arrow{margin-left:auto;color:var(--muted);font-size:18px}

  .primary{background:linear-gradient(135deg,#2563eb,#1d4ed8);border-color:transparent}
  .primary .ico{background:rgba(255,255,255,.18)}
  .primary:hover{background:linear-gradient(135deg,#2f6df0,#2147d6)}

  .foot{margin-top:30px;color:var(--muted);font-size:12.5px;line-height:1.6}
  .foot a{color:var(--accent);text-decoration:none}
</style>
</head>
<body>
  <div class="wrap">
    <img class="avatar" src="avatar.jpg" alt="Taiwo Alabi" />
    <h1>Taiwo Alabi</h1>
    <p class="tag" id="tagline">I build AI tools that solve real problems.</p>
    <div class="loc">📍 Dublin, Ireland</div>

    <div class="links" id="links"></div>

    <div class="foot">
      MSc Artificial Intelligence &middot; National College of Ireland<br/>
      <a href="mailto:alabitaiwo625@gmail.com">alabitaiwo625@gmail.com</a>
    </div>
  </div>

<script>
/* ============================================================
   EDIT HERE — add / remove / reorder links anytime.
   Each item: { icon, title, sub, url, primary(optional) }
   Save the file, push to GitHub, done. The QR never changes.
   ============================================================ */
const LINKS = [
  {
    icon: "in",
    title: "LinkedIn",
    sub: "Connect with me",
    url: "https://www.linkedin.com/in/tami-alabi/",
    primary: true
  },
  {
    icon: "📈",
    title: "AI Trading Assistant",
    sub: "Scans 48 markets, gives one clear call",
    url: "https://iamtamilore.github.io/ai-trading-assistant/"
  },
  {
    icon: "🛡️",
    title: "Terms Guard AI",
    sub: "Reads any T&Cs, flags risky clauses (GDPR)",
    url: "https://newtazer-terms-guard-ai.hf.space"
  },
  {
    icon: "💻",
    title: "GitHub",
    sub: "See my code",
    url: "https://github.com/iamtamilore"
  },
  // To add a new project, copy a block above and change the fields.
];

const wrap = document.getElementById("links");
wrap.innerHTML = LINKS.map(l => `
  <a class="btn ${l.primary ? 'primary' : ''}" href="${l.url}" target="_blank" rel="noopener">
    <span class="ico">${l.icon}</span>
    <span class="meta"><span>${l.title}</span><small>${l.sub}</small></span>
    <span class="arrow">›</span>
  </a>`).join("");
</script>
</body>
</html>
